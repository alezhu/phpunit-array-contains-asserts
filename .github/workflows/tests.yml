name: Test Suite

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php }} - PHPUnit ${{ matrix.phpunit }}
    runs-on: ubuntu-latest
    env:
      XDEBUG_MODE: coverage

    strategy:
      fail-fast: false
      matrix:
        include:
          # PHPUnit 9 (compatible with PHP 7.3, 7.4, 8.0, 8.1)
          - branch: PHPUnit_9
            php: '7.3'
            phpunit: '9'
          - branch: PHPUnit_9
            php: '7.4'
            phpunit: '9'
          - branch: PHPUnit_9
            php: '8.0'
            phpunit: '9'
          - branch: PHPUnit_9
            php: '8.1'
            phpunit: '9'

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      - name: Check PHP Version
        run: php -v

      - name: Require specific PHPUnit version
        run: composer require --dev "phpunit/phpunit:^${{ matrix.phpunit }}" --no-update --no-interaction

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-phpunit-${{ matrix.phpunit }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-phpunit-${{ matrix.phpunit }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Run test suite
        run: composer run-script coverage

      - name: Upload Coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml
        continue-on-error: true
