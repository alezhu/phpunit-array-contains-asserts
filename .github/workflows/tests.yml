name: Test Suite

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: PHP ${{ matrix.php }} - PHPUnit ${{ matrix.phpunit }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # PHPUnit 11 (compatible with PHP 8.2, 8.3, 8.4, 8.5)
          - branch: main
            php: '8.2'
            phpunit: '11'
          - branch: main
            php: '8.3'
            phpunit: '11'
          - branch: main
            php: '8.4'
            phpunit: '11'
          - branch: main
            php: '8.5'
            phpunit: '11'

          # PHPUnit 10 (compatible with PHP 8.1, 8.2, 8.3, 8.4)
          - branch: main
            php: '8.1'
            phpunit: '10'
          - branch: main
            php: '8.2'
            phpunit: '10'
          - branch: main
            php: '8.3'
            phpunit: '10'
          - branch: main
            php: '8.4'
            phpunit: '10'

          # PHPUnit 9 (compatible with PHP 7.3, 7.4, 8.0, 8.1)
          - branch: PHPUnit_9
            php: '7.3'
            phpunit: '9'
          - branch: PHPUnit_9
            php: '7.4'
            phpunit: '9'
          - branch: PHPUnit_9
            php: '8.0'
            phpunit: '9'
          - branch: PHPUnit_9
            php: '8.1'
            phpunit: '9'

          # PHPUnit 8 (compatible with PHP 7.2, 7.3, 7.4)
          - branch: PHPUnit_8
            php: '7.2'
            phpunit: '8'
          - branch: PHPUnit_8
            php: '7.3'
            phpunit: '8'
          - branch: PHPUnit_8
            php: '7.4'
            phpunit: '8'

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Check PHP Version
        run: php -v

      - name: Require specific PHPUnit version
        run: composer require --dev "phpunit/phpunit:^${{ matrix.phpunit }}" --no-update --no-interaction

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-phpunit-${{ matrix.phpunit }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-phpunit-${{ matrix.phpunit }}-

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Run test suite
        run: composer run-script coverage
